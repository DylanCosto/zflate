[package]
name = "zflate"
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
description = "A pure-Rust DEFLATE, zlib, and gzip codec aiming to match or beat libdeflate"
license = "MIT"
repository = "https://github.com/DylanCosto/zflate"
readme = "README.md"
keywords = ["deflate", "gzip", "zlib", "compression", "bgzf"]
categories = ["compression"]
# The library and its notices only: the tests, benchmarks, examples, experiments and the
# working documents stay in the repository.
include = ["/src", "/README.md", "/LICENSE", "/NOTICE"]

[features]
# Testing only: never dispatch to the BMI2 or SIMD builds, so that the portable code runs
# on a CPU that has the features.
force-portable = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"
libdeflater = "1.26"
zune-inflate = "0.2.54"

[[bench]]
name = "codec"
harness = false

[profile.release]
codegen-units = 1
lto = "fat"

[profile.bench]
codegen-units = 1
lto = "fat"
debug = true

[[bench]]
name = "crc32"
harness = false

[[bench]]
name = "adler32"
harness = false
